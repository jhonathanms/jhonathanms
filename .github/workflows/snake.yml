name: cobrinha das contribuicoes

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#5aa2ff&color_dots=#ebedf0,#c6dcff,#9cc2ff,#5aa2ff,#3b7fe0
            dist/snake-dark.svg?palette=github-dark&color_snake=#8b6cff&color_dots=#161b22,#1f3a68,#2f5fa8,#5aa2ff,#9cc2ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
